services:
  postgres:
    image: postgres:17-alpine
    container_name: anime-streaming-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: adonis
      POSTGRES_PASSWORD: adonis
      POSTGRES_DB: anime_streaming
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
